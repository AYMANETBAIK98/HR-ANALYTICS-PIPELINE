# How dbt connects to the warehouse. Values come from environment variables
# (set in docker-compose.yml), so no password is written in the code.
hr_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5434') | as_number }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'hr') }}"
      user: "{{ env_var('WAREHOUSE_USER', 'hr') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD', 'hr') }}"
      schema: public
      threads: 4
